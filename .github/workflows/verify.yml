name: Verify proofs and calculations

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compute periods with two exact algorithms
        run: |
          python3 proofs/harkness-period/verify_harkness.py
          python3 proofs/harkness-period/harkness_independent.py
      - name: Independently check finite sums and shortest-path counts
        run: |
          python3 proofs/shared/sun-antichain/verify_sun.py
          python3 proofs/knor-geodesics-14/verify_geodesics.py
      - name: Install the pinned Lean toolchain
        run: |
          sudo apt-get -o Dir::Etc::sourcelist=sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- update -qq
          sudo apt-get install --yes elan
          elan toolchain install "$(cat lean-toolchain)"
      - name: Check the counterexample
        run: |
          lean --version
          lean proofs/harkness-period/HarknessPeriod.lean
      - name: Verify both conjectures on sums of powers
        run: |
          export LEAN_PATH="$RUNNER_TEMP/sun-olean"
          mkdir -p "$LEAN_PATH"
          (cd proofs/shared/sun-antichain && lean -o "$LEAN_PATH/DigitCost.olean" DigitCost.lean && lean -o "$LEAN_PATH/SunAntichain.olean" SunAntichain.lean)
          lean proofs/sun-a362743/A362743.lean
          lean proofs/sun-a362861/A362861.lean
      - name: Verify finite and general geodesic constructions
        if: ${{ !cancelled() }}
        run: |
          lean proofs/knor-geodesics-14/Geodesics.lean
          lean proofs/knor-geodesics-14/LayerFamily.lean
      - name: Verify the distinct sums of powers of three
        if: ${{ !cancelled() }}
        run: lean proofs/sun-a362861-1i/Ternary.lean
      - name: Verify the finite subset sums for base five
        if: ${{ !cancelled() }}
        working-directory: proofs/sun-a362861-1i
        run: |
          python3 verify_seed.py
          mkdir -p "$RUNNER_TEMP/distinct-sums"
          lean -o "$RUNNER_TEMP/distinct-sums/SeedFive.olean" SeedFive.lean
      - name: Verify the complete classification for base five
        if: ${{ !cancelled() }}
        working-directory: proofs/sun-a362861-1i
        run: |
          export LEAN_PATH="$RUNNER_TEMP/distinct-sums"
          lean -o "$LEAN_PATH/FiveCoverage.olean" FiveCoverage.lean
          lean FiveCharacterization.lean
      - name: Check distinct sums with restricted exponents
        if: ${{ !cancelled() }}
        working-directory: proofs/sun-a362861-1ii
        run: |
          python3 verify_pairs.py
          mkdir -p "$RUNNER_TEMP/odd-pair"
          lean -o "$RUNNER_TEMP/odd-pair/ThreeSeven.olean" ThreeSeven.lean
      - name: Check the odd-base obstructions and classification
        if: ${{ !cancelled() }}
        working-directory: proofs/sun-a362861-1ii
        run: |
          export LEAN_PATH="$RUNNER_TEMP/odd-pair"
          mkdir -p "$LEAN_PATH"
          lean -o "$LEAN_PATH/Obstructions.olean" Obstructions.lean
          lean Classification.lean
      - name: Verify Kimberling's reciprocal floor series
        if: ${{ !cancelled() }}
        working-directory: proofs/kimberling-a289261
        run: |
          python3 verify_kimberling.py
          lean Kimberling.lean
      - name: Verify the independence and neighborhood bounds of the prism
        if: ${{ !cancelled() }}
        working-directory: proofs/larson-van-cleemput-periphery
        run: |
          mkdir -p "$RUNNER_TEMP/rook-olean"
          lean -o "$RUNNER_TEMP/rook-olean/RookTenIndependent.olean" RookTenIndependent.lean
      - name: Verify the periphery counterexample from the graph's edges
        if: ${{ !cancelled() }}
        working-directory: proofs/larson-van-cleemput-periphery
        run: |
          export LEAN_PATH="$RUNNER_TEMP/rook-olean"
          python3 verify_graph.py
          lean Prism.lean
      - name: Enumerate smaller connected graphs
        if: ${{ !cancelled() }}
        working-directory: proofs/larson-van-cleemput-periphery
        run: |
          sudo apt-get install --yes nauty
          python3 verify_graph.py --census nauty-geng
      - name: Verify the coefficientwise comparison
        if: ${{ !cancelled() }}
        run: |
          export LEAN_PATH="$RUNNER_TEMP/kimberling-olean"
          mkdir -p "$LEAN_PATH"
          (cd proofs/kimberling-a289261 && lean -o "$LEAN_PATH/Kimberling.olean" Kimberling.lean)
          lean proofs/kimberling-a078140/KimberlingFamily.lean
      - name: Check the ternary nested MDS obstruction
        if: ${{ !cancelled() }}
        working-directory: proofs/huang-fang-fu-mds
        run: |
          python3 verify_hff.py
          lean HuangFangFu.lean
      - name: Verify the 16-ary self-orthogonal MDS code
        if: ${{ !cancelled() }}
        working-directory: proofs/liu-self-orthogonal-mds
        run: |
          python3 verify_liu16.py
          lean Liu16.lean

  kimberling-real:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean and the matching mathlib release
        run: |
          sudo apt-get -o Dir::Etc::sourcelist=sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- update -qq
          sudo apt-get install --yes elan
          elan toolchain install "$(cat lean-toolchain)"
          git clone --depth 1 --branch v4.19.0 https://github.com/leanprover-community/mathlib4 "$RUNNER_TEMP/kimberling-mathlib"
          cd "$RUNNER_TEMP/kimberling-mathlib"
          test "$(git rev-parse HEAD)" = c44e0c8ee63ca166450922a373c7409c5d26b00b
          lake exe cache get Mathlib/Data/Real/Archimedean.lean Mathlib/Algebra/Order/Floor/Ring.lean Mathlib/Tactic/Linarith.lean Mathlib/Tactic/Ring.lean
      - name: Verify the floor-series result for real parameters
        run: |
          cd "$RUNNER_TEMP/kimberling-mathlib"
          lake env bash -eu -c '
            project_lib="$RUNNER_TEMP/kimberling-olean"
            mkdir -p "$project_lib"
            IFS=: read -ra libs <<< "$LEAN_PATH"
            export LEAN_PATH="$project_lib"
            for lib in "${libs[@]}"; do
              LEAN_PATH="$LEAN_PATH:$(realpath -m "$lib")"
            done
            cd "$GITHUB_WORKSPACE/proofs/kimberling-a289261"
            lean -o "$project_lib/Kimberling.olean" Kimberling.lean
            cd ../kimberling-a078140
            lean -o "$project_lib/KimberlingFamily.olean" KimberlingFamily.lean
            lean KimberlingReal.lean
            python3 verify_golden_limit.py
          '

  additional-proofs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Lean and mathlib versions
        run: |
          sudo apt-get -o Dir::Etc::sourcelist=sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- update -qq
          sudo apt-get install --yes elan
          elan toolchain install "$(cat lean-toolchain)"
          git clone -q --depth 1 --branch v4.19.0 https://github.com/leanprover-community/mathlib4 "$RUNNER_TEMP/research-mathlib"
          cd "$RUNNER_TEMP/research-mathlib"
          test "$(git rev-parse HEAD)" = c44e0c8ee63ca166450922a373c7409c5d26b00b
          mapfile -t imports < <(awk '$1 == "import" && $2 ~ /^Mathlib/ {gsub(/\./, "/", $2); print $2 ".lean"}' "$GITHUB_WORKSPACE"/proofs/clark-dispersion/*.lean "$GITHUB_WORKSPACE"/proofs/liu-odd-self-orthogonal-mds/*.lean | sort -u)
          lake exe cache get "${imports[@]}"
          mkdir -p "$RUNNER_TEMP/proof-olean"
      - name: Verify clark-dispersion
        if: ${{ !cancelled() }}
        run: |
          cd "$RUNNER_TEMP/research-mathlib"
          lake env bash -eu -c '
            folder="$GITHUB_WORKSPACE/proofs/clark-dispersion"
            compiled="$RUNNER_TEMP/proof-olean"
            export LEAN_PATH="$compiled:$LEAN_PATH"
            lean --root="$folder" -o "$compiled/GraphQuarter.olean" "$folder/GraphQuarter.lean"
            lean --root="$folder" -o "$compiled/Scalar.olean" "$folder/Scalar.lean"
          '
      - name: Verify liu-odd-self-orthogonal-mds
        if: ${{ !cancelled() }}
        run: |
          cd "$RUNNER_TEMP/research-mathlib"
          lake env bash -eu -c '
            folder="$GITHUB_WORKSPACE/proofs/liu-odd-self-orthogonal-mds"
            compiled="$RUNNER_TEMP/proof-olean"
            export LEAN_PATH="$compiled:$LEAN_PATH"
            lean --root="$folder" -o "$compiled/LiuSeven.olean" "$folder/LiuSeven.lean"
          '
