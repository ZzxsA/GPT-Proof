name: Verify proofs and calculations

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compute periods with two exact algorithms
        run: |
          python3 proofs/harkness-period/verify_harkness.py
          python3 proofs/harkness-period/harkness_independent.py
      - name: Independently check finite sums and shortest-path counts
        run: |
          python3 proofs/shared/sun-antichain/verify_sun.py
          python3 proofs/knor-geodesics-14/verify_geodesics.py
      - name: Install the pinned Lean toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes elan
          elan toolchain install "$(cat lean-toolchain)"
      - name: Check the counterexample
        run: |
          lean --version
          lean proofs/harkness-period/HarknessPeriod.lean
      - name: Verify both conjectures on sums of powers
        run: |
          export LEAN_PATH="$RUNNER_TEMP/sun-olean"
          mkdir -p "$LEAN_PATH"
          (cd proofs/shared/sun-antichain && lean -o "$LEAN_PATH/DigitCost.olean" DigitCost.lean && lean -o "$LEAN_PATH/SunAntichain.olean" SunAntichain.lean)
          lean proofs/sun-a362743/A362743.lean
          lean proofs/sun-a362861/A362861.lean
      - name: Verify finite and general geodesic constructions
        if: ${{ !cancelled() }}
        run: |
          lean proofs/knor-geodesics-14/Geodesics.lean
          lean proofs/knor-geodesics-14/LayerFamily.lean
